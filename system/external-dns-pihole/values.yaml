external-dns:
  image:
    repository: registry.k8s.io/external-dns/external-dns
    tag: "v0.17.0"
    pullPolicy: IfNotPresent
  provider: pihole
  extraArgs:
    - --pihole-api-version=6
    - --pihole-server=http://pihole-web.pihole.svc.cluster.local
  interval: 5m
  triggerLoopOnEvent: true
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
