app-template:
  controllers:
    main:
      containers:
        main:
          image:
            repository: docker.io/louislam/uptime-kuma
            tag: "1"
  service:
    main:
      ports:
        http:
          port: 3001
          protocol: HTTP
  ingress:
    main:
      enabled: true
      className: private
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        external-dns.alpha.kubernetes.io/target: private-relay.mbund.org
      hosts:
        - host: &host uptime-kuma.mbund.org
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - hosts:
            - *host
          secretName: uptime-kuma-tls-certificate
  persistence:
    data:
      accessMode: ReadWriteOnce
      storageClass: local-path
      size: 10Gi
      advancedMounts:
        main:
          main:
            - path: /app/data
              subPath: data
  serviceMonitor:
    main:
      enabled: true
      serviceName: uptime-kuma
      endpoints:
        - port: http
          path: /metrics
          interval: 1m
          scrapeTimeout: 10s
