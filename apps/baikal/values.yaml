app-template:
  controllers:
    main:
      containers:
        main:
          image:
            repository: docker.io/ckulka/baikal
            tag: 0.10.1-nginx
  service:
    main:
      ports:
        http:
          port: 80
          protocol: HTTP
  ingress:
    main:
      enabled: true
      className: private
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        external-dns.alpha.kubernetes.io/target: private-relay.testing.mbund.org
      hosts:
        - host: &host baikal.testing.mbund.org
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
                port: http
      tls:
        - hosts:
            - *host
          secretName: baikal-tls-certificate
  persistence:
    data:
      accessMode: ReadWriteOnce
      storageClass: local-path
      size: 10Gi
      advancedMounts:
        main:
          main:
            - path: /var/www/baikal/config
              subPath: config
            - path: /var/www/baikal/Specific
              subPath: specific
