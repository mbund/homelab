app-template:
  controllers:
    server:
      containers:
        server:
          image:
            repository: ghcr.io/immich-app/immich-server
            tag: v1.132.3
          env:
            REDIS_HOSTNAME: immich-redis-master
            DB_HOSTNAME: immich-postgres-rw.immich.svc.cluster.local
            DB_USERNAME: immich
            DB_DATABASE_NAME: immich
            DB_PASSWORD: immich
            IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
    machine-learning:
      containers:
        machine-learning:
          image:
            repository: ghcr.io/immich-app/immich-machine-learning
            tag: v1.132.3
          env:
            TRANSFORMERS_CACHE: /cache
  service:
    server:
      controller: server
      ports:
        http:
          port: 2283
          protocol: HTTP
    machine-learning:
      controller: machine-learning
      ports:
        http:
          port: 3003
          protocol: HTTP
  ingress:
    server:
      enabled: true
      className: private
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        external-dns.alpha.kubernetes.io/target: private-relay.testing.mbund.org
        nginx.ingress.kubernetes.io/proxy-body-size: "0"
      hosts:
        - host: &host immich.testing.mbund.org
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: server
                port: http
      tls:
        - hosts:
            - *host
          secretName: immich-tls-certificate
  persistence:
    cache:
      accessMode: ReadWriteOnce
      storageClass: local-path
      size: 10Gi
      advancedMounts:
        machine-learning:
          machine-learning:
            - path: /cache
              subPath: cache
    upload:
      accessMode: ReadWriteOnce
      storageClass: local-path
      size: 10Gi
      advancedMounts:
        server:
          server:
            - path: /usr/src/app/upload
              subPath: upload

redis:
  enabled: true
  architecture: standalone
  global:
    storageClass: local-path
  auth:
    enabled: false

